# Builds crates/termrs-share-web and publishes its web/ folder to GitHub Pages.
name: Deploy share page to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - "crates/termrs-share-web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      # Must match the wasm-bindgen version pinned in
      # crates/termrs-share-web/Cargo.toml.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Build the browser client and page
        run: bash crates/termrs-share-web/build.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/termrs-share-web/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
