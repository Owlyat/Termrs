# Builds crates/termrs-share-web and publishes its web/ folder to GitHub Pages.
name: Deploy share page to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - "crates/termrs-share-web/**"
      - "crates/termrs-share-proto/**"
      - "crates/termrs/src/share.rs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      # Must match the wasm-bindgen version pinned in
      # crates/termrs-share-web/Cargo.toml.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Build the browser client and page
        run: bash crates/termrs-share-web/build.sh

      # GitHub Pages caches assets for ~10 min; version the entry files with
      # the commit so browsers pick up new builds without a hard refresh.
      - name: Cache-bust the page assets
        run: |
          stamp="${GITHUB_SHA::8}"
          sed -i \
            -e "s|\./main\.js|./main.js?v=${stamp}|g" \
            -e "s|\./style\.css|./style.css?v=${stamp}|g" \
            -e "s|\./vendor/xterm\.css|./vendor/xterm.css?v=${stamp}|g" \
            -e "s|\./vendor/xterm\.js|./vendor/xterm.js?v=${stamp}|g" \
            crates/termrs-share-web/web/index.html
          sed -i \
            -e "s|\./wasm/termrs_share_web\.js|./wasm/termrs_share_web.js?v=${stamp}|g" \
            crates/termrs-share-web/web/main.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/termrs-share-web/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
